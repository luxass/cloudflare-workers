name: GitHub Actions Security Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [ opened, synchronize ]
    paths:
      - ".github/workflows/**"
  push:
    branches:
      - main
      - "renovate/**"
    paths:
      - ".github/workflows/**"

permissions: {}

jobs:
  zizmor:
    uses: luxass/shared-workflows/.github/workflows/reusable-ci-security.yaml@7be4a924607be148a2093d4651d920cfcc9a264f # v0.13.0
    permissions:
      contents: read
      security-events: write
      id-token: write
    with:
      zizmor-version: v1.23.1
