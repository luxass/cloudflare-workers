name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: luxass/shared-workflows/.github/workflows/reusable-test.yaml@411fe8f8a0a53eab5153356ac5e0f174cd245eb2 # v0.17.1
    permissions:
      contents: read
    with:
      node-version: "24"
