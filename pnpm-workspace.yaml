ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
# pnpm appears to false-positive on evlog's trusted publishing metadata:
# https://github.com/HugoRCD/evlog/issues/168
trustPolicyExclude:
  - evlog@2.13.0
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - apps/*
  - packages/*
  - stacks

overrides:
  "@smithy/core": 3.33.2
  "@smithy/node-http-handler": 4.11.2

catalogs:
  alchemy:
    "@effect/platform-node": 4.0.0-rc.108
    alchemy: 2.0.0-beta.72
    effect: 4.0.0-rc.108

  dev:
    "@cloudflare/vitest-pool-workers": 0.16.20
    typescript: 6.0.3
    turbo: 2.10.1
    oxfmt: 0.57.0
    oxlint: 1.72.0
    oxlint-tsgolint: 0.24.0
    vitest: 4.1.9
    wrangler: 4.105.0
    "@cloudflare/workers-types": 4.20260630.1

  prod:
    "@hono/zod-openapi": 1.4.0
    "@octokit/core": 7.0.6
    "@octokit/plugin-paginate-rest": 14.0.0
    "@scalar/hono-api-reference": 0.11.7
    ai: 6.0.177
    evlog: 2.19.2
    hono: 4.12.27
    workers-ai-provider: 3.3.0
    zod: 4.4.3

  image:
    "@resvg/resvg-wasm": 2.4.1
    hono-jsx-to-react: 0.2.1
    satori: 0.21.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd

minimumReleaseAgeExclude:
  - "@smithy/core@3.33.2"
  - "@smithy/node-http-handler@4.11.2"
  - "@smithy/types@4.17.2"
