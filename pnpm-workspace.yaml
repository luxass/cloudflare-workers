ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - apps/*
  - packages/*

catalogs:
  dev:
    "@cloudflare/vite-plugin": 2.0.0-beta.sha-52b0dc0e9
    "@cloudflare/vitest-pool-workers": 0.22.0
    cf: 1.0.0-beta.13
    vite: 8.3.4
    typescript: 7.0.2
    turbo: 2.11.5
    oxfmt: 0.70.0
    oxlint: 1.83.0
    oxlint-tsgolint: 7.0.2003
    vitest: 5.0.1
    wrangler: 4.142.0
    "@cloudflare/workers-types": 5.20260928.1

  prod:
    "@hono/zod-openapi": 1.6.3
    "@octokit/core": 7.0.8
    "@octokit/plugin-paginate-rest": 15.0.0
    "@scalar/hono-api-reference": 0.12.6
    ai: 7.0.118
    evlog: 2.29.0
    hono: 4.13.9
    workers-ai-provider: 4.0.0
    zod: 4.6.5

  assets-test:
    # The Workers test pool requires Vitest 4, while the workspace uses Vitest 5.
    vitest: 4.1.11

  image:
    "@resvg/resvg-wasm": 2.4.1
    hono-jsx-to-react: 0.2.1
    satori: 0.33.5

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
