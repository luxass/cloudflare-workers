ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - apps/*
  - packages/*

minimumReleaseAgeExclude:
  - cf@1.0.0-beta.18
  - "@cloudflare/vite-plugin@2.0.0-beta.v.1"
  - "@cloudflare/vitest-plugin@1.4.4"
  - "@cloudflare/build-output-utils@0.9.3"
  - "@cloudflare/config@0.27.0"
  - "@cloudflare/runtime-types@0.1.12"
  - "miniflare@5.20261012.1-beta"
  - "wrangler@4.151.1"

catalogs:
  dev:
    "@cloudflare/vite-plugin": 2.0.0-beta.v.1
    "@cloudflare/vitest-plugin": 1.4.4
    cf: 1.0.0-beta.18
    vite: 8.3.4
    typescript: 7.0.2
    turbo: 2.11.5
    oxfmt: 0.70.0
    oxlint: 1.83.0
    oxlint-tsgolint: 7.0.2003
    vitest: 5.0.1
    wrangler: 4.142.0
    "@cloudflare/workers-types": 5.20260928.1

  prod:
    "@hono/zod-openapi": 1.6.3
    "@octokit/core": 7.0.8
    "@octokit/plugin-paginate-rest": 16.0.0
    "@scalar/hono-api-reference": 0.12.6
    ai: 7.0.118
    evlog: 2.29.0
    hono: 4.13.9
    workers-ai-provider: 4.0.0
    zod: 4.6.5

  assets:
    "@cloudflare/workers-types": 5.20261006.1

  image:
    "@resvg/resvg-wasm": 2.4.1
    hono-jsx-to-react: 0.2.1
    satori: 0.32.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
