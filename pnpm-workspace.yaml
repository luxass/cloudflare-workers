ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

packages:
  - apps/*
  - packages/*

catalogs:
  dev:
    "@cloudflare/vitest-pool-workers": 0.22.0
    typescript: 7.0.2
    turbo: 2.11.2
    oxfmt: 0.68.0
    oxlint: 1.83.0
    oxlint-tsgolint: 7.0.2002
    vitest: 5.0.1
    wrangler: 4.135.0
    "@cloudflare/workers-types": 5.20260921.1

  prod:
    "@hono/zod-openapi": 1.6.3
    "@octokit/core": 7.0.8
    "@octokit/plugin-paginate-rest": 15.0.0
    "@scalar/hono-api-reference": 0.12.2
    ai: 7.0.107
    evlog: 2.29.0
    hono: 4.13.8
    workers-ai-provider: 4.0.0
    zod: 4.6.5

  image:
    "@resvg/resvg-wasm": 2.4.1
    hono-jsx-to-react: 0.2.1
    satori: 0.21.0

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
